syntax = "proto3";

package jobworker;

option go_package = "teleport/pkg/proto";

// JobStatus represents the current state of a job
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;  // Default value, should not be used
  JOB_STATUS_CREATED = 1;      // Job created but not started
  JOB_STATUS_RUNNING = 2;      // Job is currently executing
  JOB_STATUS_COMPLETED = 3;    // Job finished successfully
  JOB_STATUS_ERROR = 4;        // Job failed or encountered an error
  JOB_STATUS_STOPPED = 5;      // Job was manually stopped
}

service JobWorker {
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc StreamJobOutput(StreamJobOutputRequest) returns (stream StreamJobOutputResponse);
}

message StartJobRequest {
  string command = 1;
  repeated string args = 2;
}

message StartJobResponse {
  string job_id = 1;
  JobStatus status = 2;
  string start_time = 3;
}

message StopJobRequest {
  string job_id = 1;
}

message StopJobResponse {
  // End time when the job was stopped (RFC3339 format)
  string end_time = 1;
  // If the job could not be stopped, an error is returned via the RPC error, not in this message.
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  JobStatus status = 1;
  int32 exit_code = 2;
  string start_time = 3;
  string end_time = 4;
}

message StreamJobOutputRequest {
  string job_id = 1;
}

message StreamJobOutputResponse {
  bytes data = 1;
  string timestamp = 2;
} 